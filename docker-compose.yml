services:
  mysql:
    image: mysql:8.0
    container_name: diploma-mysql
    ports:
      - '13306:3306'
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: pass
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent']
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:15
    container_name: diploma-postgres
    ports:
      - '15432:5432'
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: pass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 30

  gate-simulator:
    build: ./gate-simulator
    container_name: diploma-gate-simulator
    ports:
      - '9999:9999'
    restart: unless-stopped

  selenium-chrome:
    image: selenium/standalone-chrome:4.21.0-20240522
    container_name: diploma-selenium-chrome
    shm_size: 2gb
    ports:
      - '4444:4444'
    environment:
      SE_NODE_MAX_SESSIONS: '1'
      SE_START_VNC: 'false'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:4444/status | grep -q "\"ready\": true"']
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql-data:
  postgres-data:
